name: check

on:
  pull_request:

jobs:

  get-ref-version:
    uses: ./.github/workflows/_reusable-get-version.yml

  check-version:
    needs: [get-ref-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version consistency
        env:
          REF_VERSION: ${{ needs.get-ref-version.outputs.version }}
        run: |
          set -euo pipefail
          TYPST_TOML=$(awk -F'"' '/^version *=/ {print $2; exit}' typst.toml)
          JUSTFILE=$(awk -F'"' '/^project_tag/ {print $2; exit}' justfile)
          README=$(grep -o '@preview/community-ostfalia-thesis:[0-9.]\+' README.md | head -n1 | awk -F: '{print $2}')
          METADATA=$(grep -o '@preview/community-ostfalia-thesis:[0-9.]\+' template/metadata.typ | head -n1 | awk -F: '{print $2}')
          echo "typst.toml: $TYPST_TOML"
          echo "justfile:   $JUSTFILE"
          echo "README.md:  $README"
          echo "metadata:   $METADATA"
          if [ "$REF_VERSION" != "$TYPST_TOML" ] || [ "$REF_VERSION" != "$JUSTFILE" ] || [ "$REF_VERSION" != "$README" ] || [ "$REF_VERSION" != "$METADATA" ]; then
            echo "Version mismatch detected!"
            exit 1
          fi
          echo "All versions match: $REF_VERSION"


  build:
    needs: [prepare, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: ["en"]
        type: ["draft"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install Package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          mkdir -p ~/.cache/typst/packages/preview/community-ostfalia-thesis/${{ env.RELEASE_VERSION }}
          cp -r ./ ~/.cache/typst/packages/preview/community-ostfalia-thesis/${{ env.RELEASE_VERSION }}

      - name: Build Thesis - ${{ matrix.lang }}/${{ matrix.type }}
        run: typst compile template/thesis.typ template/thesis-${{ needs.prepare.outputs.release_version }}-${{ matrix.lang }}_${{ matrix.type }}.pdf --input lang=${{ matrix.lang }} --input type=${{ matrix.type }}
